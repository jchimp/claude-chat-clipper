<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #1b1c1d;
        --panel: #242526;
        --fg: #e8e6e3;
        --muted: #9a9893;
        --accent: #b07d2b;
        --line: #34352f;
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header b { font-size: 13px; }
      header .site { margin-left: auto; color: var(--muted); font-size: 11px; }
      .body { padding: 12px 14px; }
      button {
        width: 100%;
        padding: 9px 12px;
        margin-bottom: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--fg);
        cursor: pointer;
        font-size: 13px;
      }
      button.primary { background: var(--accent); color: #1b1c1d; border-color: var(--accent); font-weight: 600; }
      button:hover { filter: brightness(1.12); }
      button:disabled { opacity: .5; cursor: default; filter: none; }
      .status { min-height: 18px; font-size: 11px; color: var(--muted); margin-top: 2px; word-break: break-word; }
      .status.ok { color: #7fc77f; }
      .status.warn { color: #d9b25a; }
      .status.err { color: #e08a8a; }
    </style>
  </head>
  <body>
    <header>
      <b>Claude Chat Clipper</b>
      <span class="site" id="site">…</span>
    </header>
    <div class="body">
      <button class="primary" id="copyMd">Copy as Markdown</button>
      <button id="copyJson">Copy as JSON</button>
      <button id="download">Download .md</button>
      <button id="copyErr" hidden>Copy error details</button>
      <div class="status" id="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
